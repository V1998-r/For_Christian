<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little parcel for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Kalam:wght@400;700&family=Caveat:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     DESIGN TOKENS — a kraft-paper parcel, cream interior,
     pink/butter/mint/sky stickers & tape.
     ========================================================= */
  :root{
    --cream:#FFF8EC;
    --paper:#FFFDF8;
    --kraft:#DCB98F;
    --kraft-mid:#C79E6E;
    --kraft-dark:#A87C4E;
    --kraft-deep:#7A5734;
    --pink:#FF7FA6;
    --pink-deep:#E8547E;
    --mint:#5FBF8F;
    --mint-deep:#3F9B6E;
    --butter:#FFCE54;
    --sky:#7FC4D9;
    --sky-deep:#4FA0B8;
    --violet:#9B7FD4;
    --violet-deep:#7457B5;
    --ink:#4A3728;
    --ink-soft:#8A705A;
    --shadow: rgba(122,87,52,.28);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 18%, rgba(255,127,166,.10) 0, transparent 45%),
      radial-gradient(circle at 88% 12%, rgba(95,191,143,.12) 0, transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(127,196,217,.12) 0, transparent 45%),
      var(--cream);
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3{font-family:'Baloo 2',sans-serif; margin:0;}
  :focus-visible{outline:3px dashed var(--pink-deep); outline-offset:3px; border-radius:6px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }

  /* ---------- decorative floating doodles ---------- */
  .floaties{position:fixed; inset:0; pointer-events:none; z-index:0;}
  .floaties svg{position:absolute; opacity:.5; animation:float 7s ease-in-out infinite;}
  .floaties svg:nth-child(2){animation-delay:1.2s;}
  .floaties svg:nth-child(3){animation-delay:2.4s;}
  .floaties svg:nth-child(4){animation-delay:.6s;}
  .floaties svg:nth-child(5){animation-delay:1.8s;}
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-14px) rotate(6deg);}
  }

  /* =========================================================
     STAGE 1 — the box
     ========================================================= */
  .stage{
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:32px 20px; position:relative; z-index:1;
    transition:opacity .6s ease, transform .6s ease;
  }
  .stage.hidden-stage{opacity:0; transform:translateY(-30px) scale(.96); pointer-events:none; height:0; overflow:hidden;}

  .intro{
    text-align:center; margin-bottom:28px; font-family:'Kalam',cursive;
    color:var(--ink-soft); font-size:1.05rem; letter-spacing:.3px;
  }

  .box-wrap{ perspective:1200px; cursor:pointer; }
  .box{
    position:relative; width:260px; height:210px;
    transform-style:preserve-3d;
  }
  .box-front{
    position:absolute; inset:0; top:52px;
    background:linear-gradient(160deg, var(--kraft) 0%, var(--kraft-mid) 100%);
    border-radius:6px;
    box-shadow:0 22px 40px -12px var(--shadow), inset 0 0 0 2px rgba(122,87,52,.15);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
  }
  .box-front::before, .box-front::after{ /* corrugated seam lines */
    content:""; position:absolute; left:14px; right:14px; height:2px;
    background:rgba(122,87,52,.18); border-radius:2px;
  }
  .box-front::before{ top:16px; } .box-front::after{ bottom:16px; }

  .box-lid{
    position:absolute; top:0; left:0; width:100%; height:60px;
    transform-origin:top center; transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.6,-0.28,.2,1.3);
    z-index:3;
  }
  .lid-top{
    width:100%; height:100%;
    background:linear-gradient(160deg, var(--kraft-mid) 0%, var(--kraft-dark) 100%);
    border-radius:6px 6px 2px 2px;
    box-shadow:0 8px 18px -6px var(--shadow);
  }
  .box.open .box-lid{ transform:rotateX(-125deg) translateY(-4px); }

  .tape{
    position:absolute; width:70px; height:22px; background:rgba(255,206,84,.85);
    top:38px; z-index:5; box-shadow:0 2px 4px rgba(0,0,0,.08);
    transition:transform .7s ease .1s, opacity .5s ease .1s;
  }
  .tape-l{ left:8px; transform:rotate(-40deg);}
  .tape-r{ right:8px; transform:rotate(40deg);}
  .box.open .tape-l{ transform:rotate(-70deg) translate(-30px,-22px); opacity:0; }
  .box.open .tape-r{ transform:rotate(70deg) translate(30px,-22px); opacity:0; }

  .label{
    background:var(--paper); width:150px; padding:10px 12px; border-radius:3px;
    box-shadow:0 3px 8px rgba(0,0,0,.10); transform:rotate(-2deg);
    font-family:'Kalam',cursive; font-size:.85rem; line-height:1.5;
  }
  .label-row span{font-weight:700; color:var(--pink-deep);}
  .seal{
    width:38px; height:38px; border-radius:50%; background:var(--pink);
    color:white; display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; box-shadow:0 3px 6px rgba(0,0,0,.15);
    transform:rotate(8deg);
  }

  .hint{
    text-align:center; margin-top:20px; font-family:'Kalam',cursive;
    color:var(--ink-soft); font-size:1rem; animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);} }

  .sparkle{
    position:absolute; pointer-events:none; z-index:6;
  }

  /* =========================================================
     STAGE 2 — the corkboard of unwrapped items
     ========================================================= */
  .board{
    position:relative; z-index:1; max-width:980px; margin:0 auto; padding:40px 20px 90px;
    opacity:0; transform:translateY(20px); transition:opacity .7s ease, transform .7s ease;
  }
  .board.show{ opacity:1; transform:translateY(0); }

  .progress{
    position:sticky; top:14px; z-index:20; display:inline-flex; align-items:center; gap:8px;
    background:var(--paper); border:2px solid var(--kraft-mid); border-radius:999px;
    padding:8px 16px; font-family:'Kalam',cursive; font-size:.95rem;
    box-shadow:0 4px 10px rgba(0,0,0,.06); float:right;
  }
  .board-title{
    font-size:1.6rem; margin-bottom:26px; color:var(--ink);
  }
  .board-title span{color:var(--pink-deep);}

  .cards{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:26px 22px;
    clear:both; padding-top:6px;
  }
  .card{
    background:var(--paper); border-radius:10px; padding:16px 16px 18px;
    box-shadow:0 10px 22px -10px rgba(74,55,40,.35);
    cursor:pointer; position:relative; opacity:0; transform:translateY(24px) rotate(var(--r,0deg)) scale(.9);
    animation:pop-in .55s cubic-bezier(.2,.8,.3,1.2) forwards;
    transition:transform .25s ease, box-shadow .25s ease;
    border:1px solid rgba(122,87,52,.10);
  }
  .card:hover{ transform:translateY(-4px) rotate(0deg) scale(1.02); box-shadow:0 16px 28px -10px rgba(74,55,40,.4); }
  .card.opened{ opacity:.72; }
  .card.opened::after{
    content:"opened ✓"; position:absolute; top:10px; right:12px;
    font-family:'Kalam',cursive; font-size:.72rem; color:var(--mint-deep);
  }
  @keyframes pop-in{ to{ opacity:1; transform:translateY(0) rotate(var(--r,0deg)) scale(1);} }

  .tape-strip{
    position:absolute; top:-10px; left:50%; transform:translateX(-50%) rotate(-3deg);
    width:64px; height:18px; opacity:.9; border-radius:2px;
    box-shadow:0 2px 3px rgba(0,0,0,.08);
  }
  .card .icon{ width:34px; height:34px; margin-bottom:8px; }
  .card h3{ font-size:1.05rem; margin-bottom:4px; }
  .card p{ font-size:.85rem; color:var(--ink-soft); margin:0; line-height:1.4; }
  .card .kind{
    font-family:'Kalam',cursive; font-size:.7rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); margin-bottom:2px; display:block;
  }

  /* ---------- finale ---------- */
  .finale{
    margin:50px auto 0; max-width:420px; text-align:center; background:var(--paper);
    border-radius:14px; padding:34px 28px; box-shadow:0 14px 30px -12px rgba(74,55,40,.35);
    transform:rotate(-1deg); opacity:0; animation:pop-in .6s ease forwards;
  }
  .finale .seal{ margin:0 auto 14px; }
  .finale h2{ font-size:1.4rem; margin-bottom:8px; }
  .finale p{ font-family:'Caveat',cursive; font-size:1.3rem; color:var(--ink-soft); line-height:1.4; }
  .replay{
    margin-top:18px; border:2px solid var(--kraft-mid); background:transparent; color:var(--ink);
    font-family:'Kalam',cursive; padding:8px 18px; border-radius:999px; cursor:pointer; font-size:.9rem;
  }
  .replay:hover{ background:var(--kraft); border-color:var(--kraft);}

  /* =========================================================
     MODAL
     ========================================================= */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(74,55,40,.45); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; padding:24px; z-index:100;
    opacity:0; transition:opacity .25s ease;
  }
  .modal-overlay.show{ opacity:1; }
  .modal{
    background:var(--paper); max-width:520px; width:100%; max-height:86vh; overflow-y:auto;
    border-radius:14px; padding:30px 26px 26px; position:relative;
    box-shadow:0 30px 60px -16px rgba(0,0,0,.4);
    transform:scale(.9) rotate(-1deg); transition:transform .3s cubic-bezier(.2,.8,.3,1.2);
  }
  .modal-overlay.show .modal{ transform:scale(1) rotate(0deg); }
  .modal-close{
    position:absolute; top:12px; right:14px; background:var(--kraft); border:none; width:32px; height:32px;
    border-radius:50%; font-size:1rem; cursor:pointer; color:var(--ink); line-height:1;
  }
  .modal-close:hover{ background:var(--pink); color:white; }
  .modal .kind{ font-family:'Kalam',cursive; font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--pink-deep); }
  .modal h2{ font-size:1.4rem; margin:4px 0 14px; }

  .note-body{
    font-family:'Caveat',cursive; font-size:1.4rem; line-height:1.55; color:var(--ink);
    background:repeating-linear-gradient(var(--paper) 0 34px, rgba(122,87,52,.12) 34px 35px);
    padding-top:4px;
  }

  .polaroid{ background:white; padding:10px 10px 34px; box-shadow:0 8px 18px rgba(0,0,0,.15); transform:rotate(-1.5deg); }
  .polaroid img{ width:100%; display:block; border-radius:2px; background:var(--cream); min-height:200px; object-fit:cover; }
  .polaroid figcaption{ font-family:'Caveat',cursive; font-size:1.15rem; text-align:center; margin-top:10px; color:var(--ink-soft); }

  .video-frame{ position:relative; width:100%; padding-top:56.25%; background:#1c1c1c; border-radius:8px; overflow:hidden; }
  .video-frame iframe, .video-frame video{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .video-badge{
    position:absolute; top:10px; left:10px; z-index:5; background:var(--butter); color:var(--ink);
    font-family:'Kalam',cursive; font-weight:700; font-size:.85rem; padding:5px 12px; border-radius:4px;
    transform:rotate(-3deg); box-shadow:0 3px 6px rgba(0,0,0,.25);
  }

  .postcard{ border:2px dashed var(--sky-deep); border-radius:10px; padding:18px; background:linear-gradient(180deg,#fff,#F4FBFD); }
  .postcard .pin{ width:30px; height:30px; margin-bottom:8px; }
  .maps-btn{
    display:inline-flex; align-items:center; gap:6px; margin-top:12px; background:var(--sky-deep); color:white;
    text-decoration:none; padding:9px 16px; border-radius:999px; font-family:'Kalam',cursive; font-size:.85rem;
  }
  .maps-btn:hover{ background:var(--sky); }

  .song-card{ text-align:center; padding:18px; background:linear-gradient(180deg,#FFF9EE,#FFF3D9); border-radius:10px; }
  .vinyl{
    width:90px; height:90px; border-radius:50%; margin:0 auto;
    background:repeating-radial-gradient(circle at center, #3a3a3a 0 3px, #2a2a2a 3px 6px);
    display:flex; align-items:center; justify-content:center;
    animation:spin 4s linear infinite; box-shadow:0 6px 14px rgba(0,0,0,.25);
  }
  .vinyl-hole{ width:16px; height:16px; border-radius:50%; background:var(--butter); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .doodle-box{ text-align:center; }
  .doodle-box svg{ width:100%; max-width:340px; height:auto; }
  .doodle-caption{ font-family:'Caveat',cursive; font-size:1.2rem; color:var(--ink-soft); margin-top:8px; }

  .placeholder{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    height:200px; border:2px dashed var(--kraft-mid); border-radius:8px; color:var(--ink-soft);
    font-family:'Kalam',cursive; font-size:.85rem; text-align:center; padding:12px;
  }

  /* confetti */
  .confetti{ position:fixed; top:-20px; width:9px; height:14px; z-index:200; pointer-events:none; }

  .music-pill{
    position:fixed; top:16px; left:16px; z-index:50; background:var(--paper); border:2px solid var(--kraft-mid);
    border-radius:999px; padding:8px 16px; font-family:'Kalam',cursive; font-size:.85rem; color:var(--ink);
    cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.08);
  }
  .music-pill:hover{ background:var(--kraft); }

  .credit-line{
    text-align:center; margin-top:44px; font-family:'Caveat',cursive; font-size:1.05rem;
    color:var(--ink-soft); opacity:.85;
  }

  @media (max-width:520px){
    .box{ width:220px; height:190px; }
    .box-front{ top:48px; }
    .board-title{ font-size:1.35rem; }
  }
</style>
</head>
<body>

<button class="music-pill" id="musicToggle" hidden>🎵 pause music</button>
<div id="musicMount" style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden;"></div>

<div class="floaties" aria-hidden="true">
  <svg width="26" height="26" style="top:8%;left:6%" viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9C1.1 8.6 2.7 5 6.4 5c2 0 3.4 1.2 4.1 2.4C11.2 6.2 12.6 5 14.6 5c3.7 0 5.3 3.6 3.7 7-2.3 4.4-9.3 9-9.3 9z" fill="#FF7FA6"/></svg>
  <svg width="20" height="20" style="top:70%;left:10%" viewBox="0 0 24 24"><path d="M12 2l1.8 6.3L20 10l-6.2 1.7L12 18l-1.8-6.3L4 10l6.2-1.7z" fill="#FFCE54"/></svg>
  <svg width="24" height="24" style="top:14%;right:8%" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#5FBF8F" stroke-width="2"/></svg>
  <svg width="18" height="18" style="top:80%;right:12%" viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9C1.1 8.6 2.7 5 6.4 5c2 0 3.4 1.2 4.1 2.4C11.2 6.2 12.6 5 14.6 5c3.7 0 5.3 3.6 3.7 7-2.3 4.4-9.3 9-9.3 9z" fill="#7FC4D9"/></svg>
  <svg width="22" height="22" style="top:45%;left:3%" viewBox="0 0 24 24"><path d="M12 2l1.8 6.3L20 10l-6.2 1.7L12 18l-1.8-6.3L4 10l6.2-1.7z" fill="#FF7FA6"/></svg>
</div>

<div class="stage" id="stage">
  <p class="intro" id="introText">someone left you a little package...</p>
  <div class="box-wrap" id="boxWrap">
    <div class="box" id="box">
      <div class="tape tape-l"></div>
      <div class="tape tape-r"></div>
      <div class="box-lid" id="boxLid"><div class="lid-top"></div></div>
      <div class="box-front">
        <div class="label">
          <div class="label-row">TO: <span id="labelTo">—</span></div>
          <div class="label-row">FROM: <span id="labelFrom">—</span></div>
        </div>
        <div class="seal">♥</div>
      </div>
    </div>
  </div>
  <p class="hint">tap the box to open</p>
</div>

<div class="board" id="board">
  <div class="progress" id="progress">0 / 0 opened 💌</div>
  <h2 class="board-title">everything <span>inside</span></h2>
  <div class="cards" id="cards"></div>
  <div class="finale" id="finale" hidden>
    <div class="seal" style="margin:0 auto 14px;">♥</div>
    <h2>that's everything, for now</h2>
    <p id="finaleNote">more to come. love you.</p>
    <button class="replay" id="replayBtn">wrap it back up</button>
  </div>
  <p class="credit-line" id="creditLine"></p>
</div>

<div class="modal-overlay" id="overlay" hidden>
  <div class="modal" id="modal"></div>
</div>

<script>
/* =========================================================================
   ✏️  EDIT ZONE — everything you personalize lives here.
   -------------------------------------------------------------------------
   • to / from      → names shown on the shipping label
   • items          → the stuff inside the parcel, in the order you want
                       them to appear. Add or remove as many as you like.

   ITEM TYPES:

   { type:'note', title:'...', body:'...' }
       A written note. `body` can include line breaks with \n.

   { type:'photo', title:'...', caption:'...', src:'IMAGE_URL' }
       A polaroid photo. Set `src` to an image URL, or a data: URI if you
       want it fully offline. Leave src:'' to show a placeholder.

   { type:'video', title:'...', caption:'...', src:'VIDEO_URL' }
       Accepts a YouTube link (youtube.com/watch?v=... or youtu.be/...)
       or a direct video file URL (.mp4). Leave src:'' for a placeholder.

   { type:'location', title:'...', caption:'...', mapUrl:'GOOGLE_MAPS_URL' }
       A little postcard. mapUrl opens in Google/Apple Maps etc. To get a
       link: search the place on Google Maps → Share → Copy link.

   { type:'drawing', title:'...', caption:'...', doodle:'heart' }
       A hand-drawn doodle that draws itself. `doodle` can be:
       'heart', 'flowers', or 'stars'. (Want a custom doodle? Ask me and
       I'll trace one from scratch for this exact box.)
   ========================================================================= */

const PARCEL = {
  to: "Christian",
  from: "Varuni",
  openingLine: "someone left you a little package...",
  finaleNote: "more to come. love you.",
  bgMusic: {
    youtubeId: "wX_kaM6S9ZM",
    playlistId: "PLE43207F6E0F47654",
    index: 3,
    credit: "PS the piece is Mikhail Sokolovsky – The Miller-Wizard, Trickster and Match-Maker – Overture"
  },
  items: [
    {
      type: 'note',
      title: "Read me first",
      body: "Hi you.\n\nThis is a little parcel I put together just for you — open everything whenever you want, in whatever order you want.\n\nHope it makes you smile. 💛"
    },
    {
      type: 'photo',
      title: "You, being you",
      caption: "thumbs up, obviously",
      src: "photo1.jpg"
    },
    {
      type: 'photo',
      title: "The real main character",
      caption: "unbothered as always",
      src: "photo2.jpg"
    },
    {
      type: 'photo',
      title: "Us",
      caption: "at the museum, being silly",
      src: "photo3.jpg"
    },
    {
      type: 'video',
      title: "Welcome to Baltimore",
      badge: "Welcome to Baltimore",
      caption: "🎆",
      src: "fireworks.mp4"
    },
    {
      type: 'location',
      title: "Meet me here",
      caption: "our spot",
      mapUrl: "https://maps.google.com"
    },
    {
      type: 'drawing',
      title: "I drew you this",
      caption: "violets, for you",
      doodle: "potted_violets"
    },
    {
      type: 'note',
      title: "One more thing",
      body: "Just because.\n\nThat's it, that's the note."
    }
  ]
};

/* ===================== everything below just runs the box ===================== */

document.getElementById('labelTo').textContent = PARCEL.to;
document.getElementById('labelFrom').textContent = PARCEL.from;
document.getElementById('introText').textContent = PARCEL.openingLine;
document.getElementById('finaleNote').textContent = PARCEL.finaleNote;

const ICONS = {
  note: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M16 3v3h3"/><path d="M8 11h8M8 15h5"/></svg>`,
  photo: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M21 17l-5-5-4 4-3-3-6 6"/></svg>`,
  video: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5l5 2.5-5 2.5z" fill="var(--ink)" stroke="none"/></svg>`,
  location: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.6 7-12a7 7 0 10-14 0c0 5.4 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>`,
  drawing: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l4-1 11-11-3-3L4 17z"/><path d="M14 6l3 3"/></svg>`,
  song: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>`
};
const TAPE_COLORS = { note:'var(--butter)', photo:'var(--pink)', video:'var(--sky)', location:'var(--mint)', drawing:'var(--pink-deep)', song:'var(--butter)' };
const KIND_LABEL = { note:'a note', photo:'a photo', video:'a video', location:'a place', drawing:'a doodle', song:'a song' };

const opened = new Set();
const cardsEl = document.getElementById('cards');
const boardEl = document.getElementById('board');
const stageEl = document.getElementById('stage');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const progressEl = document.getElementById('progress');
const finaleEl = document.getElementById('finale');

function seededRotation(i){
  const seq = [-4,3,-2,5,-3,2,-5,4,-2.5,3.5];
  return seq[i % seq.length];
}

function youTubeEmbed(url){
  const m = url.match(/(?:youtu\.be\/|v=)([\w-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

function preview(item){
  if(item.type==='note') return item.body.split('\n')[0];
  return item.caption || '';
}

function renderCards(){
  cardsEl.innerHTML = '';
  PARCEL.items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--r', seededRotation(i) + 'deg');
    card.style.animationDelay = (i * 0.09) + 's';
    card.setAttribute('role','button');
    card.setAttribute('tabindex','0');
    card.innerHTML = `
      <div class="tape-strip" style="background:${TAPE_COLORS[item.type]}"></div>
      <div class="icon">${ICONS[item.type]}</div>
      <span class="kind">${KIND_LABEL[item.type]}</span>
      <h3>${item.title || ''}</h3>
      <p>${preview(item)}</p>`;
    card.addEventListener('click', () => openItem(item, i, card));
    card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openItem(item,i,card);} });
    cardsEl.appendChild(card);
  });
  updateProgress();
}

function updateProgress(){
  progressEl.textContent = `${opened.size} / ${PARCEL.items.length} opened 💌`;
  if(opened.size === PARCEL.items.length){
    finaleEl.hidden = false;
    launchConfetti();
  }
}

function openItem(item, i, cardEl){
  opened.add(i);
  cardEl.classList.add('opened');
  updateProgress();

  let body = '';
  if(item.type === 'note'){
    body = `<div class="kind">${KIND_LABEL.note}</div><h2>${item.title||''}</h2>
      <div class="note-body">${item.body.replace(/\n/g,'<br>')}</div>`;
  }
  else if(item.type === 'photo'){
    const img = item.src
      ? `<img src="${item.src}" alt="${item.caption||''}">`
      : `<div class="placeholder">📷<br>add a photo — set the "src" field for this item in PARCEL.items</div>`;
    body = `<div class="kind">${KIND_LABEL.photo}</div><h2>${item.title||''}</h2>
      <figure class="polaroid">${img}<figcaption>${item.caption||''}</figcaption></figure>`;
  }
  else if(item.type === 'video'){
    let player = `<div class="placeholder">🎬<br>add a video — set the "src" field to a YouTube link or .mp4 URL</div>`;
    if(item.src){
      const yt = youTubeEmbed(item.src);
      const badge = item.badge ? `<div class="video-badge">${item.badge}</div>` : '';
      player = yt
        ? `<div class="video-frame">${badge}<iframe src="${yt}" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`
        : `<div class="video-frame">${badge}<video src="${item.src}" controls></video></div>`;
    }
    body = `<div class="kind">${KIND_LABEL.video}</div><h2>${item.title||''}</h2>
      ${player}<p style="margin-top:10px;font-family:'Caveat',cursive;font-size:1.15rem;color:var(--ink-soft);">${item.caption||''}</p>`;
  }
  else if(item.type === 'location'){
    body = `<div class="kind">${KIND_LABEL.location}</div><h2>${item.title||''}</h2>
      <div class="postcard">
        ${ICONS.location.replace('var(--ink)','var(--sky-deep)').replace('class=""','class="pin"')}
        <p style="font-family:'Caveat',cursive;font-size:1.2rem;">${item.caption||''}</p>
        <a class="maps-btn" href="${item.mapUrl||'#'}" target="_blank" rel="noopener">open in maps →</a>
      </div>`;
  }
  else if(item.type === 'song'){
    let player = `<div class="placeholder">🎵<br>add a song — set the "src" field to an audio file (.mp3) URL</div>`;
    if(item.src){
      player = `<div class="song-card">
        <div class="vinyl"><div class="vinyl-hole"></div></div>
        <audio src="${item.src}" controls style="width:100%;margin-top:14px;"></audio>
      </div>`;
    }
    body = `<div class="kind">${KIND_LABEL.song}</div><h2>${item.title||''}</h2>
      ${player}<p style="margin-top:10px;font-family:'Caveat',cursive;font-size:1.15rem;color:var(--ink-soft);">${item.caption||''}</p>`;
  }
  else if(item.type === 'drawing'){
    body = `<div class="kind">${KIND_LABEL.drawing}</div><h2>${item.title||''}</h2>
      <div class="doodle-box">${doodleSVG(item.doodle||'heart')}<p class="doodle-caption">${item.caption||''}</p></div>`;
  }

  modal.innerHTML = `<button class="modal-close" id="closeBtn" aria-label="Close">✕</button>${body}`;
  overlay.hidden = false;
  requestAnimationFrame(()=> overlay.classList.add('show'));
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', function bg(e){ if(e.target===overlay){ closeModal(); overlay.removeEventListener('click', bg);} });

  if(item.type === 'drawing') setTimeout(playDoodle, 60);
}

function closeModal(){
  overlay.classList.remove('show');
  setTimeout(()=> overlay.hidden = true, 250);
}

/* ---------- hand-drawn doodles (self-drawing SVGs) ---------- */
function doodleSVG(kind){
  const doodles = {
    heart: `<svg viewBox="0 0 200 160" fill="none">
      <path id="dpath" d="M100 140 C40 100 10 70 10 42 C10 18 30 6 50 6 C68 6 84 16 100 38 C116 16 132 6 150 6 C170 6 190 18 190 42 C190 70 160 100 100 140 Z"
        stroke="var(--pink-deep)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,
    flowers: `<svg viewBox="0 0 200 160" fill="none">
      <g id="dpath" stroke="var(--mint-deep)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M60 150 C60 100 60 80 60 50"/>
        <circle cx="60" cy="35" r="16" stroke="var(--pink-deep)"/>
        <path d="M140 150 C140 110 135 90 130 70"/>
        <circle cx="128" cy="55" r="14" stroke="var(--butter)"/>
        <path d="M100 150 C100 120 105 100 105 85"/>
        <circle cx="106" cy="70" r="15" stroke="var(--sky-deep)"/>
      </g>
    </svg>`,
    stars: `<svg viewBox="0 0 200 160" fill="none">
      <g id="dpath" stroke="var(--butter)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M60 20l8 22 23 3-17 16 5 23-19-12-19 12 5-23-17-16 23-3z"/>
        <path d="M150 60l6 16 17 2-13 12 4 17-14-9-14 9 4-17-13-12 17-2z"/>
        <path d="M100 110l5 13 14 2-10 10 3 14-12-8-12 8 3-14-10-10 14-2z"/>
      </g>
    </svg>`,
    potted_violets: `<svg viewBox="0 0 200 180" fill="none">
      <g id="dpath" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M60 170l-14-60h88l-14 60z" stroke="var(--kraft-dark)"/>
        <path d="M50 110h100" stroke="var(--kraft-dark)"/>
        <path d="M100 110V70" stroke="var(--mint-deep)"/>
        <path d="M100 95c-14-6-22-2-26 8" stroke="var(--mint-deep)"/>
        <path d="M100 85c14-6 22-2 26 8" stroke="var(--mint-deep)"/>
        <path d="M75 60c0-10 8-16 15-14-1 9-6 15-15 14z" stroke="var(--violet)"/>
        <path d="M100 46c8-6 18-4 20 4-8 5-16 4-20-4z" stroke="var(--violet)"/>
        <path d="M110 60c0-10 8-16 15-14-1 9-6 15-15 14z" stroke="var(--violet)"/>
        <circle cx="97" cy="55" r="4" stroke="var(--butter)"/>
        <path d="M55 65c0-9 7-14 13-12-1 8-5 13-13 12z" stroke="var(--violet-deep)"/>
        <circle cx="61" cy="60" r="3.5" stroke="var(--butter)"/>
        <path d="M130 68c0-9 7-14 13-12-1 8-5 13-13 12z" stroke="var(--violet-deep)"/>
        <circle cx="136" cy="63" r="3.5" stroke="var(--butter)"/>
      </g>
    </svg>`
  };
  return doodles[kind] || doodles.heart;
}
function playDoodle(){
  const el = modal.querySelector('#dpath');
  if(!el) return;
  const items = el.tagName === 'g' ? Array.from(el.children) : [el];
  items.forEach((p, idx) => {
    const len = p.getTotalLength ? p.getTotalLength() : 300;
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset 1.1s ease ${idx*0.25}s`;
    requestAnimationFrame(()=> p.style.strokeDashoffset = 0);
  });
}

/* ---------- confetti burst on finishing ---------- */
function launchConfetti(){
  const colors = ['#FF7FA6','#FFCE54','#5FBF8F','#7FC4D9'];
  for(let i=0;i<26;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    c.style.animation = `fall ${2+Math.random()*1.5}s ease-in forwards`;
    document.body.appendChild(c);
    setTimeout(()=> c.remove(), 3600);
  }
}
const styleTag = document.createElement('style');
styleTag.textContent = `@keyframes fall{to{ transform:translateY(100vh) rotate(360deg); opacity:.3; }}`;
document.head.appendChild(styleTag);

/* ---------- background music ---------- */
document.getElementById('creditLine').textContent = PARCEL.bgMusic ? PARCEL.bgMusic.credit : '';
let musicPlayer = null, musicPlaying = false;

function startMusic(){
  const cfg = PARCEL.bgMusic;
  if(!cfg || !cfg.youtubeId || musicPlayer) return;
  const mount = document.getElementById('musicMount');
  const params = new URLSearchParams({
    autoplay: '1', controls: '0', playsinline: '1', enablejsapi: '1'
  });
  if(cfg.playlistId) params.set('list', cfg.playlistId);
  if(cfg.index) params.set('index', cfg.index);
  const iframe = document.createElement('iframe');
  iframe.allow = 'autoplay; encrypted-media';
  iframe.src = `https://www.youtube.com/embed/${cfg.youtubeId}?${params.toString()}`;
  mount.appendChild(iframe);
  musicPlayer = iframe;
  musicPlaying = true;
  const btn = document.getElementById('musicToggle');
  btn.hidden = false;
  btn.textContent = '🎵 pause music';
}

function postToPlayer(func){
  if(!musicPlayer || !musicPlayer.contentWindow) return;
  musicPlayer.contentWindow.postMessage(JSON.stringify({event:'command', func, args:[]}), '*');
}

document.getElementById('musicToggle').addEventListener('click', ()=>{
  musicPlaying = !musicPlaying;
  postToPlayer(musicPlaying ? 'playVideo' : 'pauseVideo');
  document.getElementById('musicToggle').textContent = musicPlaying ? '🎵 pause music' : '🔇 play music';
});

/* ---------- box open interaction ---------- */
document.getElementById('boxWrap').addEventListener('click', openBox);
function openBox(){
  const box = document.getElementById('box');
  box.classList.add('open');
  startMusic();
  setTimeout(()=>{
    stageEl.classList.add('hidden-stage');
    boardEl.classList.add('show');
    renderCards();
  }, 900);
}

document.getElementById('replayBtn').addEventListener('click', ()=>{
  boardEl.classList.remove('show');
  finaleEl.hidden = true;
  opened.clear();
  document.getElementById('box').classList.remove('open');
  stageEl.classList.remove('hidden-stage');
  window.scrollTo({top:0, behavior:'smooth'});
});
</script>
</body>
</html>
